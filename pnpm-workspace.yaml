packages:
  - 'apps/*'
  - 'packages/*'

# pnpm blocks dependency build scripts by default. These need theirs:
# esbuild downloads its platform binary, prisma/argon2 compile natives.
onlyBuiltDependencies:
  - 'esbuild'
  - '@prisma/client'
  - '@prisma/engines'
  - 'prisma'
  - 'argon2'
  - '@nestjs/core'
