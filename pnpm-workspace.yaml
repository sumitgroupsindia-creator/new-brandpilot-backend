packages:
  - 'apps/*'
  - 'packages/*'

# pnpm blocks dependency build scripts by default. These need theirs:
# esbuild downloads its platform binary; prisma/argon2 compile natives.
# `allowBuilds` is the pnpm 11 name; `onlyBuiltDependencies` is kept for pnpm 10.
allowBuilds:
  'esbuild': true
  'prisma': true
  '@prisma/client': true
  '@prisma/engines': true
  'argon2': true
  '@nestjs/core': true

onlyBuiltDependencies:
  - 'esbuild'
  - 'prisma'
  - '@prisma/client'
  - '@prisma/engines'
  - 'argon2'
  - '@nestjs/core'
