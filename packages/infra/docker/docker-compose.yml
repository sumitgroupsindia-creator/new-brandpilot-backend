services:
  nginx:
    image: nginx:alpine
    container_name: brandpilot-nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../apps/web/dist:/usr/share/nginx/html/web:ro
      - ../../apps/admin/dist:/usr/share/nginx/html/admin:ro
    depends_on:
      - api
    networks:
      - brandpilot

  api:
    build:
      context: ../../
      dockerfile: apps/api/Dockerfile
    container_name: brandpilot-api
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - MASTER_ENCRYPTION_KEY=${MASTER_ENCRYPTION_KEY}
      - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY}
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}
      - COOKIE_SECRET=${COOKIE_SECRET}
      - STORAGE_ENDPOINT=${STORAGE_ENDPOINT}
      - STORAGE_KEY=${STORAGE_KEY}
      - STORAGE_SECRET=${STORAGE_SECRET}
      - STORAGE_BUCKET=${STORAGE_BUCKET}
      - APP_BASE_URL=${APP_BASE_URL}
    ports:
      - '3000:3000'
    depends_on:
      - mysql
      - redis
    networks:
      - brandpilot

  worker:
    build:
      context: ../../
      dockerfile: apps/api/Dockerfile
    container_name: brandpilot-worker
    restart: unless-stopped
    command: ['node', 'dist/worker.js']
    env_file:
      - ../../.env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - MASTER_ENCRYPTION_KEY=${MASTER_ENCRYPTION_KEY}
      - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY}
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}
      - COOKIE_SECRET=${COOKIE_SECRET}
      - STORAGE_ENDPOINT=${STORAGE_ENDPOINT}
      - STORAGE_KEY=${STORAGE_KEY}
      - STORAGE_SECRET=${STORAGE_SECRET}
      - STORAGE_BUCKET=${STORAGE_BUCKET}
      - APP_BASE_URL=${APP_BASE_URL}
    depends_on:
      - mysql
      - redis
    networks:
      - brandpilot

  scheduler:
    build:
      context: ../../
      dockerfile: apps/api/Dockerfile
    container_name: brandpilot-scheduler
    restart: unless-stopped
    command: ['node', 'dist/scheduler.js']
    env_file:
      - ../../.env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - MASTER_ENCRYPTION_KEY=${MASTER_ENCRYPTION_KEY}
      - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY}
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}
      - COOKIE_SECRET=${COOKIE_SECRET}
      - STORAGE_ENDPOINT=${STORAGE_ENDPOINT}
      - STORAGE_KEY=${STORAGE_KEY}
      - STORAGE_SECRET=${STORAGE_SECRET}
      - STORAGE_BUCKET=${STORAGE_BUCKET}
      - APP_BASE_URL=${APP_BASE_URL}
    depends_on:
      - mysql
      - redis
    networks:
      - brandpilot

  mysql:
    image: mysql:8.0
    container_name: brandpilot-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-brandpilot_root}
      MYSQL_DATABASE: brandpilot
      MYSQL_USER: ${MYSQL_USER:-brandpilot}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-brandpilot_pass}
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - brandpilot

  redis:
    image: redis:7-alpine
    container_name: brandpilot-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - brandpilot

volumes:
  mysql_data:
  redis_data:

networks:
  brandpilot:
    driver: bridge
