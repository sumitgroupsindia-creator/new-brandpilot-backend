user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 4096;
  use epoll;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for" '
                  'rt=$request_time cid=$http_x_correlation_id';

  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;

  # Gzip
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

  # Security headers
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self)" always;

  # Rate limit zones
  limit_req_zone $binary_remote_addr zone=api:10m rate=120r/m;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

  upstream api_servers {
    least_conn;
    server api:3000 max_fails=3 fail_timeout=30s;
  }

  server {
    listen 80;
    server_name _;
    client_max_body_size 20M;

    # Static web app
    location / {
      root /usr/share/nginx/html/web;
      try_files $uri $uri/ /index.html;
      expires -1;
      add_header Cache-Control "public, must-revalidate";
    }

    # Admin panel
    location /admin {
      alias /usr/share/nginx/html/admin;
      try_files $uri $uri/ /admin/index.html;
      expires -1;
      add_header Cache-Control "public, must-revalidate";
    }

    # API
    location /api/ {
      limit_req zone=api burst=50 nodelay;
      proxy_pass http://api_servers/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Correlation-Id $request_id;
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
    }

    # Webhooks (higher body limit, no rate limit)
    location /api/v1/webhooks/ {
      client_max_body_size 50M;
      proxy_pass http://api_servers/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health
    location /health {
      proxy_pass http://api_servers/health;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      access_log off;
    }
  }
}
